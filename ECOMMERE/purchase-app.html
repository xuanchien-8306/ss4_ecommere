<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase - Discount</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="number"]:hover {
            border-color: #667eea;
        }

        .currency {
            position: absolute;
            right: 15px;
            top: 40px;
            color: #999;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .result {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-content {
            width: 100%;
        }

        .result-content p {
            margin-bottom: 12px;
            font-size: 16px;
            color: #333;
        }

        .result-content p span {
            font-weight: 700;
            color: #667eea;
        }

        .result-content .final-total {
            background: white;
            padding: 12px;
            border-radius: 6px;
            border: 2px solid #667eea;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            color: #667eea;
            margin-top: 8px;
        }

        .result-message {
            text-align: center;
            color: #999;
            font-style: italic;
        }

        .discount-badge {
            display: inline-block;
            background: #e74c3c;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 5px;
        }

        /* Format number với dấu phân cách */
        .format-number {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Purchase - Discount</h1>
        
        <div class="form-group">
            <label for="totalInput">Tổng tiền tạm tính:</label>
            <input 
                type="number" 
                id="totalInput" 
                placeholder="Nhập tổng tiền" 
                min="0" 
                step="1000"
            >
            <span class="currency">VND</span>
        </div>

        <button id="purchaseBtn" class="btn">Purchase</button>

        <div id="result" class="result">
            <p class="result-message">Nhập tổng tiền và nhấn Purchase để xem kết quả</p>
        </div>
    </div>

    <script>
        // Hàm định dạng số tiền
        function formatCurrency(number) {
            return new Intl.NumberFormat('vi-VN').format(Math.round(number));
        }

        // Hàm tính toán mua hàng với giảm giá 10%
        function purchase(total) {
            // Kiểm tra dữ liệu đầu vào
            if (total === '' || total === null) {
                return {
                    error: 'Vui lòng nhập tổng tiền'
                };
            }

            const totalNum = parseFloat(total);

            if (isNaN(totalNum) || totalNum < 0) {
                return {
                    error: 'Tổng tiền phải là số dương'
                };
            }

            if (totalNum === 0) {
                return {
                    error: 'Tổng tiền phải lớn hơn 0'
                };
            }

            // Tính toán giảm giá 10%
            const discount = totalNum * 0.10;
            const finalTotal = totalNum - discount;

            return {
                originalTotal: totalNum,
                discount: discount,
                finalTotal: finalTotal,
                discountPercent: 10
            };
        }

        // Hàm hiển thị kết quả
        function displayResult(result) {
            const resultDiv = document.getElementById('result');
            
            if (result.error) {
                resultDiv.innerHTML = `<p class="result-message" style="color: #e74c3c;">${result.error}</p>`;
                return;
            }

            resultDiv.innerHTML = `
                <div class="result-content">
                    <p>Tổng tiền ban đầu: <span>${formatCurrency(result.originalTotal)}</span> VND</p>
                    <p>Giảm giá ${result.discountPercent}%: <span class="discount-badge">-${formatCurrency(result.discount)}</span> VND</p>
                    <div class="final-total">
                        Tổng tiền sau giảm giá: ${formatCurrency(result.finalTotal)} VND
                    </div>
                </div>
            `;
        }

        // Xử lý sự kiện nút Purchase
        document.getElementById('purchaseBtn').addEventListener('click', function() {
            const totalInput = document.getElementById('totalInput').value;
            const result = purchase(totalInput);
            displayResult(result);
        });

        // Cho phép nhấn Enter để mua hàng
        document.getElementById('totalInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                document.getElementById('purchaseBtn').click();
            }
        });

        // Xóa focus khỏi input khi nhập
        document.getElementById('totalInput').addEventListener('input', function() {
            // Có thể tự động tính toán khi người dùng nhập (tùy chọn)
        });
    </script>
</body>
</html>
